name: mobycontract-blockchain

x-ambiente-local: &ambiente-local
  PSEUDONIMO_SALT: "salt-local-de-desenvolvimento-nao-usar-em-producao"

services:
  anvil:
    build:
      context: .
      dockerfile: Dockerfile.anvil
    container_name: moby-anvil
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  deploy:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: moby-deploy
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      <<: *ambiente-local
      HARDHAT_NETWORK: localhost
      RPC_URL: "http://anvil:8545"
      CHAIN_ID_ESPERADO: "31337"
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    volumes:
      - deployments:/app/deployments
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "localhost"]
    restart: "no"

  registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moby-registry
    depends_on:
      deploy:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      <<: *ambiente-local
      RPC_URL: "http://anvil:8545"
      CHAIN_ID_ESPERADO: "31337"
      NOME_CHAIN: "anvil-local"
      CHAVE_PRIVADA: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      CHAVE_API: "chave-local-de-desenvolvimento"
      ADMIN_USUARIO: "admin"
      ADMIN_SENHA: "admin-local-de-desenvolvimento"
      JWT_SECRETO: "segredo-jwt-local-de-desenvolvimento-nao-usar-em-producao"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: registry
      DB_USER: registry
      DB_PASSWORD: registry
      PORT: "4000"
      LOG_LEVEL: info
    volumes:
      - deployments:/app/deployments:ro
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    networks:
      default:
      integracao:
        aliases:
          - registry

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    volumes:
      - dados-registry:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  testes:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: moby-testes
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *ambiente-local
      TEST_DB_HOST: db
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: registry
      TEST_DB_USER: registry
      TEST_DB_PASSWORD: registry
    command: ["npx", "hardhat", "test"]
    restart: "no"

volumes:
  deployments:
  dados-registry:

networks:
  integracao:
    driver: bridge
    name: mobycontract-integracao


#O container deplouy tem como e fim, ele instala os contratos no anvil 
# o fluxo é 
# anvil inicia -> deploy instala os contratos -> deplou encerra -> registry usa os contratos.....

