info:
  name: Ancorar - Assinatura da parte
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/ancoras/assinaturas"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: x-api-key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "contratoId": "{{contratoId}}",
        "parte": "{{parte}}"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
