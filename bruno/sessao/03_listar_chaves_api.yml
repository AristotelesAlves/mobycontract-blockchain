info:
  name: Chaves API - Listar
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api-keys"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
