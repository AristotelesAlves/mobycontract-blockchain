info:
  name: Historico do Contrato
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/contratos/{{contratoId}}/historico?desdeBloco=0"
  headers:
    - name: Accept
      value: application/json
    - name: x-api-key
      value: "{{apiKey}}"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
